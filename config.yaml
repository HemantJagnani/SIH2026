timezone: Asia/Kolkata
schedule: { hour: 5, minute: 0 }

source:
  name: fixture            # fixture | live | synthetic
  user_agent: "APIx-Prototype/0.1 (research prototype; contact: CHANGE_ME)"
  min_delay_s: 8
  max_delay_s: 15

routes:                    # weights are PLACEHOLDERS: replace with DGCA-derived passenger shares
  - { id: DEL-BOM, origin: DEL, destination: BOM, weight: 0.50 }
  - { id: DEL-BLR, origin: DEL, destination: BLR, weight: 0.30 }
  - { id: BOM-BLR, origin: BOM, destination: BLR, weight: 0.20 }

lead_days:                 # weights are ASSUMPTIONS, exposed in the UI as such
  - { days: 1,  weight: 0.25 }
  - { days: 7,  weight: 0.25 }
  - { days: 15, weight: 0.25 }
  - { days: 30, weight: 0.25 }

departure_bands:           # local departure time, inclusive start, exclusive end
  morning:   ["05:00", "12:00"]
  afternoon: ["12:00", "18:00"]
  evening:   ["18:00", "24:00"]

item_rules:
  fare_class: economy
  nonstop_only: true
  price_statistic: min     # min | median, of eligible quotes in the band
  exclude_anomalies: false # flagged quotes stay in the index unless this is true

index:
  base_value: 100
  min_coverage: 0.5        # below this, publish no level for the day
