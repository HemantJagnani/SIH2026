name: Daily Airfare Scrape & Evidence Archive

on:
  schedule:
    # Runs daily at 02:30 AM UTC (08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target collection date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Production Airfare Collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_HEADLESS: "true"
        run: |
          python apps/scraper/src/scripts/run_production_matrix_top60.py

      - name: Auto-Zip & Upload DOM Evidence to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/archive_and_sync_evidence.py ${{ github.event.inputs.target_date }}
