version: "3.9"

# Minimal docker-compose — only Postgres storage.
# Backend, frontend, and worker all run natively in your terminal.
#
# Start with: docker compose up -d postgres
# Stop with:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: apix_postgres
    environment:
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: apix_secret
      POSTGRES_DB: apix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
