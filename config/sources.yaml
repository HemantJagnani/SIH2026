  ixigo:
    enabled: false
    acquisition:
      mode: webpage
    browser:
      required: true
    robots:
      respect: true
    rate_limit:
      min_interval_seconds: 7     # OTAs typically have stricter bot detection
      max_concurrency: 1
    blocked_policy:
      captcha: stop_source
      http_403: stop_source
      http_429: backoff
      http_5xx: retry
      login_wall: stop_source

  easemytrip:
