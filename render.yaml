services:
  # ----------------------------------------------------------------------------
  # FastAPI Web Service (AERIX API)
  # ----------------------------------------------------------------------------
  - type: web
    name: aerix-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S2_HEARTBEAT_URL
        sync: false
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "90"

